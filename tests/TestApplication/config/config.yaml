imports:
    - { resource: "@AcmeSyliusExamplePlugin/config/config.yaml" }
    - { resource: "services_test.php" }

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\Acme\SyliusExamplePlugin

sylius_order:
    resources:
        order:
            classes:
                model: Tests\Acme\SyliusExamplePlugin\Entity\Order\Order

when@test:
    framework:
        test: true
